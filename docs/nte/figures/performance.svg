<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><rect width="100%" height="100%" fill="#0c1624"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="39" font-size="24" fill="#dbe6f3" font-weight="700">Historical NTE measurements</text><text x="28" y="68" font-size="14" fill="#9fb1c7" font-weight="400">4080 SUPER game render / RTX 5080 neural rendering</text><text x="28" y="109" font-size="17" fill="#dbe6f3" font-weight="600">Unique NR completions / second</text><text x="510" y="109" font-size="17" fill="#dbe6f3" font-weight="600">Full transfer elapsed / ms</text><text x="28" y="161" font-size="13" fill="#dbe6f3" font-weight="400">M339c</text><rect x="190" y="143" width="186.89" height="25" rx="4" fill="#647c95"/><text x="381.89132" y="161" font-size="13" fill="#dbe6f3" font-weight="400">26.699</text><rect x="615" y="143" width="212.19" height="25" rx="4" fill="#647c95"/><text x="832.19174" y="161" font-size="13" fill="#dbe6f3" font-weight="400">7.073</text><text x="28" y="217" font-size="13" fill="#dbe6f3" font-weight="400">M340 + ForceTagging</text><rect x="190" y="199" width="234.16" height="25" rx="4" fill="#49cfb3"/><text x="429.158127" y="217" font-size="13" fill="#dbe6f3" font-weight="400">33.451</text><rect x="615" y="199" width="180.38" height="25" rx="4" fill="#49cfb3"/><text x="800.37821" y="217" font-size="13" fill="#dbe6f3" font-weight="400">6.013</text><text x="28" y="273" font-size="13" fill="#dbe6f3" font-weight="400">M341</text><rect x="190" y="255" width="224.45" height="25" rx="4" fill="#60a5fa"/><text x="419.450653" y="273" font-size="13" fill="#dbe6f3" font-weight="400">32.064</text><rect x="615" y="255" width="165.07" height="25" rx="4" fill="#60a5fa"/><text x="785.07242" y="273" font-size="13" fill="#dbe6f3" font-weight="400">5.502</text><text x="28" y="343" font-size="16" fill="#49cfb3" font-weight="600">+25.3% historical NR cadence; tagging/resource path also changed.</text><text x="28" y="370" font-size="14" fill="#dbe6f3" font-weight="400">Not a controlled A/B. M341 saved 0.510 ms transfer but did not raise overall FPS.</text><text x="28" y="399" font-size="14" fill="#f5c77d" font-weight="400">Later runs still reported ~28 base FPS. Sixfold SDK counts are not physical display FPS.</text></g></svg>